<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="890" viewBox="0 0 1500 890" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of original TickNet-Basic, TickNet-L and TickNet-C</title>
  <desc id="desc">A comparison diagram showing differences in stem, blocks, depthwise kernels, head, parameters and FLOPs for three TickNet variants.</desc>
  <style>.t{font-family:Arial,sans-serif;fill:#172033}.h{font-size:29px;font-weight:700}.s{font-size:17px}.b{font-size:19px;font-weight:700}.small{font-size:14px}.head{fill:#0f172a}.headt{font-family:Arial,sans-serif;fill:#fff;font-size:20px;font-weight:700}.cell{stroke:#cbd5e1;stroke-width:1.2}.row{fill:#f8fafc}.l{fill:#dcfce7}.c{fill:#fef3c7}</style>
  <rect width="1500" height="890" fill="#fff"/>
  <text x="60" y="58" class="t h">So sánh kiến trúc: TickNet-Basic gốc, TickNet-L và TickNet-C</text>
  <text x="60" y="87" class="t s">Basic là baseline kế thừa; L và C là hai candidate độc lập. Chỉ TickNet-L có kết quả full training hiện tại.</text>

  <g>
    <rect x="60" y="130" width="240" height="62" class="head"/><text x="180" y="168" text-anchor="middle" class="headt">Thành phần</text>
    <rect x="300" y="130" width="380" height="62" class="head"/><text x="490" y="168" text-anchor="middle" class="headt">TickNet-Basic (gốc)</text>
    <rect x="680" y="130" width="380" height="62" fill="#166534"/><text x="870" y="168" text-anchor="middle" class="headt">TickNet-L v1 — model 4.2</text>
    <rect x="1060" y="130" width="380" height="62" fill="#a16207"/><text x="1250" y="168" text-anchor="middle" class="headt">TickNet-C v1 — model 4.3</text>

    <g class="t s">
      <rect x="60" y="192" width="240" height="76" class="row cell"/><text x="80" y="237" class="b">Kế thừa / block</text>
      <rect x="300" y="192" width="380" height="76" class="row cell"/><text x="320" y="225">FR-PDP gốc: PW1 → DW 3×3 → PW2 → SE</text><text x="320" y="249">+ full residual</text>
      <rect x="680" y="192" width="380" height="76" class="l cell"/><text x="700" y="225">Compressed PDP riêng: PW1 → mixed DW</text><text x="700" y="249">→ PW2 → SE + residual</text>
      <rect x="1060" y="192" width="380" height="76" class="c cell"/><text x="1080" y="225">Dùng trực tiếp TickNet + FR-PDP gốc</text><text x="1080" y="249">của thầy</text>

      <rect x="60" y="268" width="240" height="88" class="row cell"/><text x="80" y="319" class="b">Stem / stage channels</text>
      <rect x="300" y="268" width="380" height="88" class="row cell"/><text x="320" y="305">Stem 32; stages:</text><text x="320" y="331">128, 64, 128, 256, 512</text>
      <rect x="680" y="268" width="380" height="88" class="l cell"/><text x="700" y="305">Stem 24; stages:</text><text x="700" y="331">112, 64, 144, 288, 512</text>
      <rect x="1060" y="268" width="380" height="88" class="c cell"/><text x="1080" y="305">Stem 32; stages:</text><text x="1080" y="331">80, 48, 96→128, 192→224, 640→768→896</text>

      <rect x="60" y="356" width="240" height="76" class="row cell"/><text x="80" y="401" class="b">Block count / DW kernel</text>
      <rect x="300" y="356" width="380" height="76" class="row cell"/><text x="320" y="389">5 blocks; DW 3×3 ở mọi stage</text>
      <rect x="680" y="356" width="380" height="76" class="l cell"/><text x="700" y="389">7 blocks; stage 1–2: 3×3, stage 3–5:</text><text x="700" y="413">chia kênh 3×3 + 5×5</text>
      <rect x="1060" y="356" width="380" height="76" class="c cell"/><text x="1080" y="389">9 FR-PDP blocks; DW 3×3 gốc</text>

      <rect x="60" y="432" width="240" height="76" class="row cell"/><text x="80" y="477" class="b">Head / classifier</text>
      <rect x="300" y="432" width="380" height="76" class="row cell"/><text x="320" y="477">Head 1024 → GAP → 5 classes</text>
      <rect x="680" y="432" width="380" height="76" class="l cell"/><text x="700" y="477">Head 768 → GAP → 5 classes</text>
      <rect x="1060" y="432" width="380" height="76" class="c cell"/><text x="1080" y="477">Head 1024 → GAP → 5 classes</text>

      <rect x="60" y="508" width="240" height="76" class="row cell"/><text x="80" y="553" class="b">Parameters</text>
      <rect x="300" y="508" width="380" height="76" class="row cell"/><text x="320" y="553">1,062,223</text>
      <rect x="680" y="508" width="380" height="76" class="l cell"/><text x="700" y="553">1,096,260  (&lt; 6M)</text>
      <rect x="1060" y="508" width="380" height="76" class="c cell"/><text x="1080" y="553">5,155,467  (&lt; 6M)</text>

      <rect x="60" y="584" width="240" height="76" class="row cell"/><text x="80" y="629" class="b">GFLOPs (Mid224)</text>
      <rect x="300" y="584" width="380" height="76" class="row cell"/><text x="320" y="629">0.988343</text>
      <rect x="680" y="584" width="380" height="76" class="l cell"/><text x="700" y="629">0.796760  (&lt; 1G)</text>
      <rect x="1060" y="584" width="380" height="76" class="c cell"/><text x="1080" y="629">0.821054  (&lt; 1G)</text>

      <rect x="60" y="660" width="240" height="92" class="row cell"/><text x="80" y="713" class="b">Full training result</text>
      <rect x="300" y="660" width="380" height="92" class="row cell"/><text x="320" y="699">Không có full-run trong artifact này</text>
      <rect x="680" y="660" width="380" height="92" class="l cell"/><text x="700" y="696">Mid32: 91.6% Top-1; Mid224: 95.6% Top-1</text><text x="700" y="722">200 epochs, seed 42</text>
      <rect x="1060" y="660" width="380" height="92" class="c cell"/><text x="1080" y="699">Chưa chạy full training</text>
    </g>
  </g>
  <text x="60" y="810" class="t small">FLOPs count Conv/Linear with 1 MAC = 2 FLOPs. Không suy luận model nào tốt hơn chỉ từ thiết kế hoặc FLOPs.</text>
  <text x="60" y="840" class="t small">Nguồn: docs/MODEL_L.md, docs/MODEL_C.md và model profiles của repository.</text>
</svg>
